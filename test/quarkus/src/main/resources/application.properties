quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=mary
quarkus.datasource.password=abc
quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3306/testdb

quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.scheduler.enabled=true
quarkus.scheduler.start-mode=forced

quarkus.log.console.format=[%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."org.fuin.cqrs4j".level=DEBUG
