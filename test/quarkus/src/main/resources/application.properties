quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=mary
quarkus.datasource.password=abc
quarkus.datasource.jdbc.url=jdbc:mariadb://localhost:3306/testdb

quarkus.hibernate-orm.database.generation=drop-and-create

quarkus.scheduler.enabled=true
quarkus.scheduler.start-mode=forced

# Process-manager outbox: the drainer delivers queued commands to this app's own /cmd endpoint.
org.fuin.cqrs4j.pm.cmdqueue.url=http://localhost:8080

quarkus.log.console.format=[%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."org.fuin.cqrs4j".level=DEBUG

# Single tenant setup - the flag has no default, so it must be stated explicitly.
org.fuin.cqrs4j.multitenancy=false

# Command outbox and timeout sweeper. Both configs require an explicit batch size and retry count
# (they have no defaults), so the application does not start without them.
org.fuin.cqrs4j.pm.cmdqueue.batchSize=10
org.fuin.cqrs4j.pm.cmdqueue.maxRetries=3
org.fuin.cqrs4j.pm.timeout.batchSize=10
org.fuin.cqrs4j.pm.timeout.maxRetries=3

# Projection execution. High availability is off for a single-node test, so the lease owner is a
# fixed name and the TTL is irrelevant; "poll" is the non-push projection mode.
org.fuin.cqrs4j.projection.mode=poll
org.fuin.cqrs4j.projection.ha.enabled=false
org.fuin.cqrs4j.projection.ha.owner=test
org.fuin.cqrs4j.projection.ha.ttl=60000

# The cqrs4j defaults use Spring style cron expressions ("*/5 * * * * *"), which Quartz rejects
# unless the scheduler is told to parse them that way.
quarkus.scheduler.cron-type=spring
